[package]
name = "icm42688p"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Platform-independent embedded-hal driver for the TDK InvenSense ICM-42688-P IMU"
repository = "https://github.com/somethim/icm42688p"
homepage = "https://github.com/somethim/icm42688p"
documentation = "https://docs.rs/icm42688p"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["embedded-hal", "imu", "accelerometer", "gyroscope", "icm42688p"]
categories = ["embedded", "hardware-support", "no-std"]
exclude = ["PROJECT.md", "docs/"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
exit = "warn"

[dependencies]
embedded-hal = "1.0.0"

[dev-dependencies]
embedded-hal-mock = "0.11.1"
